<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Fieldwork — Kanban Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <span class="mark" aria-hidden="true">◱</span>
    <div>
      <h1>Fieldwork</h1>
      <p class="subtitle">Offline task board — everything here lives in your browser</p>
    </div>
  </div>

  <div class="topbar-actions">
    <button id="undoBtn" class="icon-btn" type="button" aria-label="Undo last action" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 7L3 12l6 5v-3.5c6.5 0 9.5 2 11 5.5 0-7-3-11-11-11V7z" fill="currentColor"/></svg>
      Undo
    </button>
    <button id="redoBtn" class="icon-btn" type="button" aria-label="Redo last undone action" disabled>
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 7l6 5-6 5v-3.5c-6.5 0-9.5 2-11 5.5 0-7 3-11 11-11V7z" fill="currentColor"/></svg>
      Redo
    </button>
    <span class="divider" aria-hidden="true"></span>
    <span id="saveStatus" class="save-status" role="status" aria-live="polite">Saved offline</span>
  </div>
</header>

<main class="board" id="board" aria-label="Kanban board columns">
  <!-- columns injected by app.js -->
</main>

<div id="liveRegion" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

<div id="cardTemplateHost" hidden></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
